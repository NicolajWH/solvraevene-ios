name: Solvraevene

options:
  bundleIdPrefix: dk.haugaard
  deploymentTarget:
    iOS: "26.0"

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: "77GX5T6B82"
  CODE_SIGN_STYLE: Manual

targets:
  Solvraevene:
    type: application
    platform: iOS

    sources:
      - Solvraevene

    settings:
      PRODUCT_NAME: Solvraevene
      PRODUCT_BUNDLE_IDENTIFIER: dk.haugaard.solvraevene

      GENERATE_INFOPLIST_FILE: "YES"
      INFOPLIST_KEY_CFBundleDisplayName: "Sølvrævene"
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
      INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait

      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"

      DEVELOPMENT_TEAM: "77GX5T6B82"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "match AppStore dk.haugaard.solvraevene"
      "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "match AppStore dk.haugaard.solvraevene"

schemes:
  Solvraevene:
    build:
      targets:
        Solvraevene: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
