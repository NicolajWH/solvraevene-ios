name: Solvraevene

options:
  bundleIdPrefix: dk.haugaard
  deploymentTarget:
    iOS: "26.0"
    watchOS: "11.0"

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: "77GX5T6B82"
  CODE_SIGN_STYLE: Manual

targets:
  Solvraevene:
    type: application
    platform: iOS

    sources:
      - Solvraevene
      - Shared

    dependencies:
      - target: SolvraeveneWidget
        embed: true
      - target: SolvraeveneWatchApp
        embed: true

    settings:
      PRODUCT_NAME: Solvraevene
      PRODUCT_BUNDLE_IDENTIFIER: dk.haugaard.solvraevene

      GENERATE_INFOPLIST_FILE: "YES"
      INFOPLIST_KEY_CFBundleDisplayName: "Sølvrævene"
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
      INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      INFOPLIST_KEY_UIRequiresFullScreen: "YES"
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Sølvrævene bruger din kalender til at tilføje kommende ture."

      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"

      DEVELOPMENT_TEAM: "77GX5T6B82"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "match AppStore dk.haugaard.solvraevene"
      "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "match AppStore dk.haugaard.solvraevene"

    entitlements:
      path: Solvraevene/Solvraevene.entitlements

  SolvraeveneWidget:
    type: app-extension
    platform: iOS

    sources:
      - SolvraeveneWidget
      - Shared

    info:
      path: SolvraeveneWidget/Info.plist
      properties:
        CFBundleDisplayName: "Sølvrævene"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      PRODUCT_NAME: SolvraeveneWidget
      PRODUCT_BUNDLE_IDENTIFIER: dk.haugaard.solvraevene.widget
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SKIP_INSTALL: "YES"
      DEVELOPMENT_TEAM: "77GX5T6B82"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "match AppStore dk.haugaard.solvraevene.widget"
      "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "match AppStore dk.haugaard.solvraevene.widget"

    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  SolvraeveneWatchApp:
    type: application
    platform: watchOS

    sources:
      - SolvraeveneWatchApp

    info:
      path: SolvraeveneWatchApp/Info.plist
      properties:
        CFBundleDisplayName: "Sølvrævene"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true

    settings:
      PRODUCT_NAME: SolvraeveneWatchApp
      PRODUCT_BUNDLE_IDENTIFIER: dk.haugaard.solvraevene.watchkitapp
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SKIP_INSTALL: "YES"
      DEVELOPMENT_TEAM: "77GX5T6B82"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "match AppStore dk.haugaard.solvraevene.watchkitapp"

    dependencies:
      - target: SolvraeveneWatchWidget
        embed: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  SolvraeveneWatchWidget:
    type: app-extension
    platform: watchOS

    sources:
      - SolvraeveneWatchWidget

    info:
      path: SolvraeveneWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: "Sølvrævene"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      PRODUCT_NAME: SolvraeveneWatchWidget
      PRODUCT_BUNDLE_IDENTIFIER: dk.haugaard.solvraevene.watchkitapp.watchwidget
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SKIP_INSTALL: "YES"
      DEVELOPMENT_TEAM: "77GX5T6B82"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "match AppStore dk.haugaard.solvraevene.watchkitapp.watchwidget"

    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Solvraevene:
    build:
      targets:
        Solvraevene: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
